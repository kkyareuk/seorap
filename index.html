<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8d5b43">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=1">
  <title>서랍마을 작업판</title>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#dashboard" aria-label="서랍마을 작업판 홈">
      <img src="assets/drawer-village-logo.png" alt="">
      <span><small>PROJECT BOARD</small><b>서랍마을 작업판</b></span>

    <button class="project-pill" type="button" data-project-menu><span>프로젝트</span><b>서랍마을</b></button>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="작업 메뉴">

  <dialog class="task-dialog" data-task-dialog>
    <form method="dialog" class="dialog-shell">
      <button class="dialog-close" value="close" aria-label="닫기">×</button>
      <div data-task-detail></div>
    </form>
  </dialog>

  <input type="file" accept="application/json" data-import-file hidden>
  <script src="data.js?v=1"></script>
  <script src="building-directions.js?v=1"></script>
  <script src="app.js?v=1"></script>
